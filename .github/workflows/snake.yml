name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Add dark background panel
        run: |
          python3 - <<'PY'
          import re
          p = "dist/github-snake-dark.svg"
          s = open(p).read()
          m = re.search(r'<svg[^>]*viewBox="([-\d.]+) ([-\d.]+) ([\d.]+) ([\d.]+)"[^>]*>', s)
          x, y, w, h = m.groups()
          rect = f'<rect x="{x}" y="{y}" width="{w}" height="{h}" rx="14" fill="#0d1117" stroke="#30363d"/>'
          s = s[:m.end()] + rect + s[m.end():]
          open(p, "w").write(s)
          PY

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
